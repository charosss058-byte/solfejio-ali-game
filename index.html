<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Solfejio 1-Sinf</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

  <div class="game">

    <!-- YUQORI PANEL -->
    <header class="top">

      <div class="title">
        🎵 Solfejio 1-Sinf
      </div>

      <div class="score">
        ⭐ <span id="score">0</span>
      </div>

    </header>


    <!-- ALI VIDEOSI -->
    <div class="video-wrapper">

      <video
        id="aliVideo"
        playsinline
        preload="auto"
      >
        <source
          src="Greeting.mp4"
          type="video/mp4"
        >
      </video>

    </div>


    <!-- BITTA BOSHLASH TUGMASI -->
    <button
      id="startGameBtn"
      class="start-button"
      type="button"
      onclick="startGame()"
    >
      ▶ Boshlash
    </button>


    <!-- NOTALAR -->
    <div class="notes-grid">

      <button
        class="note-btn"
        data-note="DO"
        type="button"
      >
        DO
      </button>

      <button
        class="note-btn"
        data-note="RE"
        type="button"
      >
        RE
      </button>

      <button
        class="note-btn"
        data-note="MI"
        type="button"
      >
        MI
      </button>

      <button
        class="note-btn"
        data-note="FA"
        type="button"
      >
        FA
      </button>

      <button
        class="note-btn"
        data-note="SOL"
        type="button"
      >
        SOL
      </button>

      <button
        class="note-btn"
        data-note="LA"
        type="button"
      >
        LA
      </button>

      <button
        class="note-btn"
        data-note="SI"
        type="button"
      >
        SI
      </button>

    </div>


    <!-- JAVOB -->
    <div
      id="feedbackText"
      class="feedback"
    ></div>

  </div>


  <script src="script.js"></script>

</body>
</html>
