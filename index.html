
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Solfejio 1-Sinf</title>

    <!-- TELEGRAM/FACEBOOK'DA CHIROYLI KO'RINISH UCHUN -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Solfejio 1-Sinf">
    <meta property="og:description" content="Bolalar uchun interaktiv nota o'rgatuvchi o'yin — Ali bilan birga notalarni o'rganing!">
    <meta property="og:image" content="https://charosss058-byte.github.io/solfejio-ali-game/og-image.jpg">
    <meta property="og:url" content="https://charosss058-byte.github.io/solfejio-ali-game/">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Solfejio 1-Sinf">
    <meta name="twitter:description" content="Bolalar uchun interaktiv nota o'rgatuvchi o'yin — Ali bilan birga notalarni o'rganing!">
    <meta name="twitter:image" content="https://charosss058-byte.github.io/solfejio-ali-game/og-image.jpg">

    <link rel="stylesheet" href="style.css">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        #accessGate {
            position: fixed;
            inset: 0;
            z-index: 100000;
            background: rgba(20, 20, 30, 0.92);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #accessGate .gate-box {
            background: #ffffff;
            border-radius: 16px;
            padding: 28px 24px;
            max-width: 360px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        #accessGate h2 {
            margin: 0 0 12px 0;
            font-size: 20px;
        }

        #accessGate p {
            margin: 0 0 16px 0;
            font-size: 14px;
            color: #444;
        }

        #accessGate input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 10px;
            margin-bottom: 12px;
            text-align: center;
            text-transform: uppercase;
        }

        #accessGate button {
            width: 100%;
            padding: 12px 14px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background: #4caf50;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        #accessGate button:disabled {
            opacity: 0.6;
            cursor: default;
        }

        #accessGate .gate-error {
            margin-top: 12px;
            color: #d32f2f;
            font-size: 14px;
            min-height: 18px;
        }
    </style>
</head>

<body>

    <!-- KIRISH KODI OYNASI -->
    <div id="accessGate">
        <div class="gate-box">
            <h2>🔒 Kirish kodi</h2>
            <p>O'yinni ochish uchun sizga berilgan kodni kiriting.</p>
            <input
                id="accessCodeInput"
                type="text"
                placeholder="Masalan: ALI-XXXXX"
                autocomplete="off"
                autocapitalize="characters"
            >
            <button id="accessCodeBtn" type="button">Tasdiqlash</button>
            <div id="accessGateError" class="gate-error"></div>
        </div>
    </div>

    <main class="game">

        <!-- TOP -->
        <header class="top">
            <div class="title">🎵 Solfejio 1-Sinf</div>

            <div class="score">
                ⭐ <span id="score">0</span>
            </div>
        </header>


        <!-- ALI VIDEO -->
        <section class="video-wrapper">

            <video
                id="aliVideo"
                playsinline
                preload="auto"
            >
                <source src="Greeting.mp4" type="video/mp4">
            </video>

        </section>


        <!-- ONE START BUTTON -->
        <button
            id="startGameBtn"
            class="start-button"
            type="button"
            onclick="startGame()"
        >
            ▶ Бошлаш
        </button>


        <!-- NOTE BUTTONS -->
        <section
            class="notes-grid"
            aria-label="Ноталар"
        >

            <!-- DO -->
            <button
                class="note-btn note-do"
                data-note="DO"
                type="button"
                aria-label="До нотаси"
            >
                <span class="staff">
                    <span class="note-head"></span>
                    <span class="note-stem"></span>
                </span>
            </button>


            <!-- RE -->
            <button
                class="note-btn note-re"
                data-note="RE"
                type="button"
                aria-label="Ре нотаси"
            >
                <span class="staff">
                    <span class="note-head"></span>
                    <span class="note-stem"></span>
                </span>
            </button>


            <!-- MI -->
            <button
                class="note-btn note-mi"
                data-note="MI"
                type="button"
                aria-label="Ми нотаси"
            >
                <span class="staff">
                    <span class="note-head"></span>
                    <span class="note-stem"></span>
                </span>
            </button>


            <!-- FA -->
            <button
                class="note-btn note-fa"
                data-note="FA"
                type="button"
                aria-label="Фа нотаси"
            >
                <span class="staff">
                    <span class="note-head"></span>
                    <span class="note-stem"></span>
                </span>
            </button>


            <!-- SOL -->
            <button
                class="note-btn note-sol"
                data-note="SOL"
                type="button"
                aria-label="Соль нотаси"
            >
                <span class="staff">
                    <span class="note-head"></span>
                    <span class="note-stem"></span>
                </span>
            </button>


            <!-- LA -->
            <button
                class="note-btn note-la"
                data-note="LA"
                type="button"
                aria-label="Ля нотаси"
            >
                <span class="staff">
                    <span class="note-head"></span>
                    <span class="note-stem"></span>
                </span>
            </button>


            <!-- SI -->
            <button
                class="note-btn note-si"
                data-note="SI"
                type="button"
                aria-label="Си нотаси"
            >
                <span class="staff">
                    <span class="note-head"></span>
                    <span class="note-stem"></span>
                </span>
            </button>

        </section>


        <!-- FEEDBACK -->
        <div
            id="feedbackText"
            class="feedback"
            aria-live="polite"
        ></div>

    </main>


    <!-- GAME ENGINE -->
    <script src="script.js"></script>

</body>
</html>
