<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solfejio 1-Sinf</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="game-container">
        <!-- Ali Video Player -->
        <div class="video-box">
            <video id="aliVideo" autoplay playsinline>
                <source src="Greeting.mp4" type="video/mp4">
            </video>
        </div>

        <!-- Interactive Buttons -->
        <div class="controls-box">
            <h2 id="instructionText">Notalarni o'rganamiz!</h2>
            <div class="notes-grid">
                <button class="note-btn do" onclick="checkNote('Do')">DO</button>
                <button class="note-btn re" onclick="checkNote('Re')">RE</button>
                <button class="note-btn mi" onclick="checkNote('Mi')">MI</button>
                <button class="note-btn fa" onclick="checkNote('Fa')">FA</button>
                <button class="note-btn sol" onclick="checkNote('Sol')">SOL</button>
                <button class="note-btn la" onclick="checkNote('La')">LA</button>
                <button class="note-btn si" onclick="checkNote('Si')">SI</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
