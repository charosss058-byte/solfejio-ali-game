<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Solfejio 1-Sinf</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

  <div class="game">

    <!-- ЮҚОРИ ҚИСМ -->
    <header class="top">
      <div class="title">
        🎵 Solfejio 1-Sinf
      </div>

      <div class="score">
        ⭐ <span id="score">0</span>
      </div>
    </header>


    <!-- АЛИ ВИДЕО -->
    <div class="video-wrapper">

      <video
        id="aliVideo"
        playsinline
        preload="auto"
      >
        <source src="Greeting.mp4" type="video/mp4">
      </video>

    </div>


    <!-- БИТТА БОШЛАШ ТУГМАСИ -->
    <button
      id="startGameBtn"
      class="start-button"
      type="button"
    >
      ▶ Бошлаш
    </button>


    <!-- САВОЛ -->
    <div
      id="instructionText"
      class="instruction"
    >
      🎧
    </div>


    <!-- НОТА ТУГМАЛАРИ -->
    <div class="notes-grid">

      <button
        class="note-btn"
        data-note="DO"
        type="button"
      >
        DO
      </button>

      <button
        class="note-btn"
        data-note="RE"
        type="button"
      >
        RE
      </button>

      <button
        class="note-btn"
        data-note="MI"
        type="button"
      >
        MI
      </button>

      <button
        class="note-btn"
        data-note="FA"
        type="button"
      >
        FA
      </button>

      <button
        class="note-btn"
        data-note="SOL"
        type="button"
      >
        SOL
      </button>

      <button
        class="note-btn"
        data-note="LA"
        type="button"
      >
        LA
      </button>

      <button
        class="note-btn"
        data-note="SI"
        type="button"
      >
        SI
      </button>

    </div>


    <!-- НАТИЖА -->
    <div
      id="feedbackText"
      class="feedback"
    ></div>

  </div>


  <script src="script.js"></script>

</body>
</html>
